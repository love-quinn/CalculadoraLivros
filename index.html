<!doctype html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora de livros Harry Potter</title>
    <link rel="icon" type="image/x-icon" href="./assets/favicon/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="./assets/favicon/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="./assets/favicon/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="./assets/favicon/apple-touch-icon.png" />
    <link rel="manifest" href="./assets/favicon/site.webmanifest" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Nunito', sans-serif; }
    </style>
</head>

<body class="bg-gradient-to-br from-amber-50 via-amber-100/80 to-amber-200/60 min-h-screen">
    <script defer src="index.js" type="module"></script>
    <div class="w-full min-h-screen flex flex-col">
        <div
            class="flex flex-col items-center gap-3 h-full m-auto border-2 border-amber-400/60 rounded-2xl shadow-xl shadow-amber-900/10 p-6 mt-6 md:mt-auto w-[90%] md:w-[60%] bg-white/90 backdrop-blur-sm">
            <div class="flex flex-col items-start w-full mb-4">
                <h1 class="text-2xl md:text-3xl font-extrabold text-amber-900 tracking-tight">Leitura Harry Potter e a Pedra Filosofal</h1>
                <h4 class="flex text-xl font-bold text-amber-700/90">Plano de leitura</h4>
            </div>
            <div class="rounded-sm overflow-hidden ring-4 ring-amber-300/50 rounded-xl shadow-lg">
                <img class="w-[160px] rounded-lg" src="./assets/img/Thumbnail.avif" alt="Capa Livro Harry Potter" />
            </div>
            <div class="grid mt-6 grid-cols-1 md:grid-cols-2 gap-y-4 justify-items-center items-center bg-gradient-to-br from-amber-100/80 to-amber-200/50 w-full p-4 rounded-xl border-2 border-amber-300/40 shadow-inner">
                <!-- Tabuada Celular -->
                <div class="flex flex-col gap-3 bg-white/70 rounded-xl p-4 border border-amber-200/60 shadow-sm w-full max-w-sm">
                    <div>
                        <h5 class="text-lg font-bold text-amber-900">Celular</h5>
                        <h6 class="text-amber-800/90 font-semibold">Total de páginas: 549</h6>
                    </div>
                    <div class="mobile-multiplication-table text-sm flex flex-col gap-1"></div>
                </div>

                <span class="block md:hidden border-b-2 border-amber-300/50 w-full"> </span>
                <!-- Tabuada Computador -->
                <div class="flex flex-col gap-3 bg-white/70 rounded-xl p-4 border border-amber-200/60 shadow-sm w-full max-w-sm">
                    <div>
                        <h5 class="text-lg font-bold text-amber-900">Computador</h5>
                        <h6 class="text-amber-800/90 font-semibold">Total de páginas: 252</h6>
                    </div>
                    <div class="desktop-multiplication-table text-sm flex flex-col gap-1"></div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
